<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" role="img" aria-labelledby="title desc">
  <title id="title">HAO/527</title>
  <desc id="desc">A terminal-style introduction to hao-527, featuring quality engineering, AI developer tools and side projects.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#101f21"/><stop offset="1" stop-color="#090e15"/>
    </linearGradient>
    <linearGradient id="accent"><stop stop-color="#78ffe0"/><stop offset="1" stop-color="#64aaff"/></linearGradient>
    <radialGradient id="scope"><stop stop-color="#163b39"/><stop offset="1" stop-color="#0d2025"/></radialGradient>
    <linearGradient id="beam"><stop stop-color="#76f4db" stop-opacity=".02"/><stop offset="1" stop-color="#76f4db" stop-opacity=".36"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#8bffdc" stroke-opacity=".085"/>
    </pattern>
    <clipPath id="card"><rect x="1" y="1" width="838" height="328" rx="20"/></clipPath>
  </defs>
  <style>
    text {font-family: ui-monospace, SFMono-Regular, Consolas, monospace}
    .sweep {transform-origin: 697px 163px; animation: spin 8s linear infinite}
    .cursor {animation: blink 1.2s steps(1,end) infinite}
    @keyframes spin {to {transform:rotate(360deg)}}
    @keyframes blink {50% {opacity:0}}
    @media (prefers-reduced-motion: reduce) {.sweep,.cursor {animation:none}}
  </style>
  <g clip-path="url(#card)">
    <rect width="840" height="330" fill="url(#bg)"/>
    <path d="M485 42H840V283H485Z" fill="url(#grid)"/>
