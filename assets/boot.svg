    <circle cx="42" cy="22" r="4" fill="#ffc77c"/>
    <circle cx="57" cy="22" r="4" fill="#6394a8"/>
    <text x="78" y="26" fill="#b6d0d1" font-size="12">hao@github:~</text>
    <text x="811" y="26" text-anchor="end" fill="#7cf8da" font-size="11">PROFILE.SVG</text>
    <text x="38" y="91" fill="#ffc77c" font-size="14">$ whoami</text>
    <text x="32" y="178" fill="url(#accent)" font-size="92" font-weight="800" letter-spacing="-6">HAO<tspan fill="#e7fff9">/</tspan>527</text>
    <text x="39" y="221" fill="#d3eae9" font-size="19">Quality engineering <tspan fill="#7cf8da">/</tspan> AI dev tools</text>
    <text x="39" y="251" fill="#a4c1c8" font-size="15">From software to hardware.<tspan class="cursor" fill="#ffc77c"> ▌</tspan></text>
    <circle cx="697" cy="163" r="86" fill="url(#scope)" stroke="#4b8685"/>
    <g fill="none" stroke="#346460">
      <circle cx="697" cy="163" r="62"/><circle cx="697" cy="163" r="38"/>
      <path d="M597 163H797M697 63V263M637 103L757 223M757 103L637 223" stroke-dasharray="3 5"/>
    </g>
    <g class="sweep">
      <path d="M697 163L666 83A86 86 0 0 1 746 93Z" fill="url(#beam)"/>
      <path d="M697 163L746 93" stroke="#77e8ce"/>
    </g>
    <g fill="#ffc77c">
      <circle cx="647" cy="146" r="3"/><circle cx="722" cy="116" r="3"/><circle cx="741" cy="189" r="3"/>
    </g>
    <circle cx="697" cy="163" r="4" fill="#78ffe0"/>
    <path d="M654 145l18 8m35-9 12-21m-11 46 25 15" stroke="#85dcc6" stroke-dasharray="2 4"/>
